<svg width="100%" viewBox="0 0 600 180" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Janela de terminal com código animado, em tons de azul</title>
<desc>Bloco de código mostrando um objeto developer com nome Lucas Almeida de Souza e role alternando entre quatro valores, em paleta azul</desc>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;display=swap');
  .code {
    font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
    font-size: 16px;
  }
  .keyword { fill: #38BDF8; }
  .variable { fill: #7DD3FC; }
  .property { fill: #0EA5E9; }
  .string { fill: #60A5FA; }
  .operator { fill: #F8FAFC; }
  .punctuation { fill: #F8FAFC; opacity: 0.7; }
  .role {
    opacity: 0;
    animation: rotateRole 24s infinite;
  }
  @keyframes rotateRole {
    0% { opacity: 0; }
    1.7% { opacity: 1; }
    23.3% { opacity: 1; }
    25% { opacity: 0; }
    100% { opacity: 0; }
  }
</style>
<rect width="600" height="180" rx="12" fill="#0F172A00" stroke="#1E293B" stroke-width="1"/>
<circle cx="25" cy="25" r="6" fill="#FF5F56"/>
<circle cx="45" cy="25" r="6" fill="#FFBD2E"/>
<circle cx="65" cy="25" r="6" fill="#27C93F"/>
<text x="30" y="70" class="code">
  <tspan class="keyword">const</tspan>
  <tspan class="variable"> developer</tspan>
  <tspan class="operator"> =</tspan>
  <tspan class="punctuation"> {</tspan>
</text>
<text x="50" y="100" class="code">
  <tspan class="property">name<tspan class="punctuation">:</tspan></tspan>
  <tspan class="string"> "Lucas Almeida de Souza"<tspan class="punctuation">,</tspan></tspan>
</text>
<text x="50" y="130" class="code">
  <tspan class="property">role<tspan class="punctuation">:</tspan></tspan>
</text>
<text x="102.8" y="130" class="code role" style="animation-delay: 0s;">
  <tspan class="string"> "Full Stack Developer"</tspan>
</text>
<text x="102.8" y="130" class="code role" style="animation-delay: 6s;">
  <tspan class="string"> "Next.js Developer"</tspan>
</text>
<text x="102.8" y="130" class="code role" style="animation-delay: 12s;">
  <tspan class="string"> "Node.js Developer"</tspan>
</text>
<text x="102.8" y="130" class="code role" style="animation-delay: 18s;">
  <tspan class="string"> "Java Spring Developer"</tspan>
</text>
<text x="30" y="160" class="code">
  <tspan class="punctuation">};</tspan>
</text>
</svg>